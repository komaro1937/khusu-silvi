<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jipcinema - JS Intro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Bcinema</div>
    </header>

    <!-- ELEMEN 1: Latar Belakang Hero (Atribut Style yang akan diubah) -->
    <section id="hero-section">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <!-- ELEMEN 2: Judul dan Deskripsi (Konten innerHTML yang akan diubah) -->
            <h1 id="hero-title" class="hero-title">DOLLHOME</h1>
            <p id="hero-desc" class="hero-desc">Di balik rumah yang indah, teror psikologis mengintai saat batas antara keluarga sungguhan dan boneka porselen hidup mulai menghilang.</p>
            
            <div class="hero-buttons">
                <!-- ELEMEN 3: Tombol Play (Mengubah display untuk menampilkan trailer) -->
                <button class="btn btn-play" onclick='document.getElementById("trailer-modal").style.display = "flex"'>
                    ▶ Putar
                </button>
                
                <!-- ELEMEN 4: Tombol Info (Mengubah warna teks/Style) -->
                <button class="btn btn-info" onclick='document.getElementById("hero-desc").style.color = "#e50914"'>
                    ⓘ Selengkapnya
                </button>
            </div>
        </div>
    </section>

    <section class="movie-row">
        <h2>Rekomendasi Untukmu</h2>
        <div class="thumbnails">
            <!-- 
                MENGUBAH ATRIBUT & KONTEN: 
                Saat gambar ini diklik, JavaScript mengganti background, judul, dan sinopsis di bagian Hero atas.
            -->
            <img src="img/horor-card.jpg" alt="Horor" 
                 onclick='
                 document.getElementById("hero-title").innerHTML = "DOLLHOME"; 
                 document.getElementById("hero-desc").innerHTML = "Di balik rumah yang indah, teror psikologis mengintai saat batas antara keluarga sungguhan dan boneka porselen hidup mulai menghilang.";
                 document.getElementById("hero-section").style.backgroundImage = "url(img/horor-hero.jpg)";
                 document.getElementById("hero-desc").style.color = "white";'>

            <img src="img/sfci-card.jpg" alt="Sci-Fi" 
                 onclick='
                 document.getElementById("hero-title").innerHTML = "INTERTELLAHAR"; 
                 document.getElementById("hero-desc").innerHTML = "Bumi di ambang kehancuran. Misi melintasi lubang lahar menjadi harapan terakhir sekaligus ujian terbesar umat manusia di galaksi kota Bekasi.";
                 document.getElementById("hero-section").style.backgroundImage = "url(img/sfci-hero.jpg)";
                 document.getElementById("hero-desc").style.color = "white";'>

            <img src="img/card.jpg" alt="Komedi" 
                 onclick='
                 document.getElementById("hero-title").innerHTML = "Bentar lu siapa dah?"; 
                 document.getElementById("hero-desc").innerHTML = "Bangun-bangun beda tubuh! Ridho dan Reza harus menghadapi kekacauan pertukaran tubuh, komet nyasar, dan ingatan yang ambyar dalam komedi supranatural yang absurd.";
                 document.getElementById("hero-section").style.backgroundImage = "url(img/hero.jpg)";
                 document.getElementById("hero-desc").style.color = "white";'>
                 
            <img src="img/action-card.jpg" alt="Aksi" 
                 onclick='
                 document.getElementById("hero-title").innerHTML = "Ojan Wick 2"; 
                 document.getElementById("hero-desc").innerHTML = "Terkepung puluhan senjata tanpa jalan keluar. Sang legenda pembunuh bayaran dipaksa kembali untuk menghabisi mereka semua, akankah Ojan di bayar.";
                 document.getElementById("hero-section").style.backgroundImage = "url(img/action-hero.jpg)";
                 document.getElementById("hero-desc").style.color = "white";'>
            <img src="img/romance-card.jpg" alt="Romantis"
                  onclick='
                  document.getElementById("hero-title").innerHTML = "Falling into your smile";
                  document.getElementById("hero-desc").innerHTML = "Cinta, ketulusan, dan perjuangan. Dua hati saling menguatkan hingga akhirnya jatuh cinta pada sebuah senyuman.";
                  document.getElementById("hero-section").style.backgroundImage = "url(img/romance-hero.jpg)";
                  document.getElementById("hero-desc").style.color = "white";'>
        </div>
    </section>

    <!-- Modal Trailer (Awalnya disembunyikan dengan display: none) -->
    <div id="trailer-modal">
        <!-- Mengubah display menjadi none untuk menyembunyikan trailer -->
        <span class="close-btn" onclick='document.getElementById("trailer-modal").style.display = "none"'>&times;</span>
        <!-- Dummy Video Trailer dari YouTube -->
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Trailer" allowfullscreen></iframe>
    </div>

</body>
</html>
